<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gestione Prodotto</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="product.css">
    <script src="product.js" defer></script>
</head>
<body>
<div class="product-container">
    <h1 id="form-title">Caricamento...</h1>
    <p id="barcode-display"></p>

    <div class="form-group">
        <label for="brand-input">Marca</label>
        <input type="text" id="brand-input">
    </div>

    <div class="form-group">
        <label for="name-input">Nome Prodotto</label>
        <input type="text" id="name-input">
    </div>

    <div class="form-group">
        <label for="comment-input">Commento</label>
        <input type="text" id="comment-input">
    </div>

    <div class="form-group">
        <label for="likeness-input">Rating</label>
        <input type="range" id="likeness-input" min="0" max="1" step="0.01" value="0.5">
        <span id="likeness-val-display">50%</span>
    </div>

    <button id="save-button">Salva</button>
    <button id="cancel-button">Annulla</button>
    <button id="remove-button" disabled>Elimina</button>
</div>
</body>
</html>
