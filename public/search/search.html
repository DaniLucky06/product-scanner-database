<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gestione Prodotto</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="search.css">
    <script src="search.js" defer></script>
</head>
<body>
<div class="container">
    <h1 id="form-title">Ricerca prodotto</h1>
    <p id="barcode-display"></p>

    <div class="form-group">
        <label for="name-search">Nome</label>
        <input type="text" id="name-search">
    </div>

    <button id="search-button">Cerca</button>
    <button id="return-button">Annulla</button>
</div>
<div class="pagination-container">
    <button id="prev-button">Precedenti</button>
    <button id="next-button">Successivi</button>
</div>
<div class="search-results container">
    <div class="legend">
        <button class="legend-p">Nome</button>
        <div class="vertical-line"></div>
        <button class="legend-p">Marca</button>
        <div class="vertical-line"></div>
        <button class="legend-p rating">Rating</button>
        <div class="vertical-line"></div>
        <button class="legend-p data">Data</button>
    </div>
</div>
</body>
</html>
